<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en"><meta charset="utf-8"><title>Animal gallery browser checks</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>body{font:14px monospace}iframe{display:block;width:1280px;height:900px;border:0}pre{white-space:pre-wrap}</style>
<h1>Animal gallery browser checks</h1><pre id="report">Running…</pre><iframe src="../animals.html" title="Animal gallery under test"></iframe>
<script>
'use strict';
const frame=document.querySelector('iframe'), report=document.querySelector('#report'), results=[];
const delay=()=>new Promise(r=>setTimeout(r,50));
function check(ok,message){results.push({passed:!!ok,message});if(!ok)throw Error(message);}
frame.addEventListener('load',async()=>{
try {
 const d=frame.contentDocument,w=frame.contentWindow,q=s=>d.querySelector(s),cards=()=>[...d.querySelectorAll('.card')];
 const all=w.ANIMAL_ATLAS.animals, redwood=all.filter(a=>a.habitats.includes('RedwoodForest'));
 const query=value=>{q('#search').value=value;q('#search').dispatchEvent(new Event('input',{bubbles:true}));};
 const habitat=value=>{q('#habitat').value=value;q('#habitat').dispatchEvent(new Event('change',{bubbles:true}));};
 check(cards().length===all.length&&all.length===w.ANIMAL_ATLAS.catalogCount,'The full source catalog appears');
 check([...d.querySelectorAll('[data-animal-count]')].every(e=>Number(e.textContent)===all.length),'Page counts follow the catalog');
 check(cards()[0].querySelector('h3').textContent==='Alligator snapping turtle','Names are sorted alphabetically');
 check(d.querySelectorAll('#filters button').length===6,'All five animal groups plus all-animals filter');
 check(q('#habitat').options.length===Object.keys(w.ANIMAL_ATLAS.biomes).length+1,'Every biome is available as a filter');
 query('leafcutter');check(cards().length===1&&cards()[0].textContent.includes('Leafcutter ant'),'Search finds tiny animals');
 query('redwood');check(cards().length===redwood.length,'Search finds animals by habitat');
 q('#reset-filters').click();
 const mammals=[...d.querySelectorAll('#filters button')].find(b=>b.textContent==='Mammals');mammals.click();
 check(cards().length===all.filter(a=>a.category==='Mammals').length&&mammals.getAttribute('aria-pressed')==='true','Mammal group and accessible selection');
 check(cards().some(c=>c.textContent.includes('Whale'))&&!cards().some(c=>c.textContent.includes('Hammerhead')),'Whales are mammals, sharks are not');
 habitat('RedwoodForest');check(cards().length===redwood.filter(a=>a.category==='Mammals').length,'Category and habitat filters combine');
 query('wolf');check(cards().length===1,'Search combines with group and habitat');
 cards()[0].querySelector('button').click();
 check(q('#detail').open&&q('#detail-title').textContent==='Wolf','Correct animal dialog opens');
 check(d.querySelectorAll('#view-controls button').length===4,'Four pose and angle controls');
 const wolf=w.ANIMAL_ATLAS.animals.find(a=>a.id==='Wolf');
 for(let i=0;i<4;i++){
  d.querySelectorAll('#view-controls button')[i].click();
  check(q('#detail-image').getAttribute('src')===wolf.views[i].image&&d.querySelectorAll('#view-controls [aria-pressed=true]').length===1,`View ${i+1} shows the matching model`);
 }
 check(q('#original-image').getAttribute('href')===wolf.views[3].image,'Open-image link follows the chosen view');
 check(q('#detail-size').textContent.includes('×'),'Resting dimensions are displayed');
 check([...d.querySelectorAll('#detail-habitats a')].some(a=>a.getAttribute('href')==='atlas.html#biome=RedwoodForest'),'Habitat links target the matching biome');
 q('#close-detail').click();await delay();check(!q('#detail').open&&!d.body.classList.contains('modal-open'),'Close restores scrolling');
 q('#reset-filters').click();cards()[0].querySelector('button').click();q('#next').click();
 check(q('#detail-title').textContent==='Anaconda','Next follows visible alphabetical order');
 d.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
 check(q('#detail-title').textContent==='Alligator snapping turtle','Arrow keys navigate animals');
 q('#close-detail').click();await delay();
 habitat('Volcanic');check(cards().length===0&&!q('#empty').hidden,'Empty habitat explains no matching animals');
 q('#reset-filters').click();check(cards().length===all.length&&q('#habitat').value==='','Reset restores the complete catalog');
 query('not-a-real-animal');check(cards().length===0&&!q('#empty').hidden,'Empty text search is recoverable');q('#reset-filters').click();
 for(const width of [1280,768,375,320]){
  frame.style.width=`${width}px`;await delay();
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,`Gallery fits ${width}px`);
  w.openAnimal('Giraffe');await delay();
  check(q('#detail').scrollWidth<=q('#detail').clientWidth+1&&q('#detail').getBoundingClientRect().width<=width,`Animal details fit ${width}px`);
  q('#close-detail').click();await delay();
 }
 for(const id of ['Bat','RiverOtter','Penguin']){
  const animal=all.find(a=>a.id===id);
  check(!!animal,`${id} is present in the source catalog`);
  const card=cards().find(c=>c.querySelector('h3').textContent===animal.name);
  check(!!card,`${animal.name} has a gallery card`);card.querySelector('button').click();
  check(q('#detail').open&&q('#detail-title').textContent===animal.name,`${animal.name} opens its own details`);
  for(let i=0;i<4;i++){
   d.querySelectorAll('#view-controls button')[i].click();
   check(q('#detail-image').getAttribute('src')===animal.views[i].image,`${animal.name} view ${i+1} uses its portrait`);
  }
  const links=[...d.querySelectorAll('#detail-habitats a')].map(a=>a.getAttribute('href'));
  check(links.length===animal.habitats.length&&animal.habitats.every(id=>links.includes(`atlas.html#biome=${encodeURIComponent(id)}`)),`${animal.name} links all of its habitats`);
  q('#close-detail').click();await delay();
 }
 const images=w.ANIMAL_ATLAS.animals.flatMap(a=>a.views.map(v=>v.image));
 const loaded=await Promise.all(images.map(src=>new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im.naturalWidth===512&&im.naturalHeight===512);im.onerror=()=>resolve(false);im.src='../'+src;})));
 check(loaded.length===all.length*4&&loaded.every(Boolean),'Every model view loads at 512 × 512');
 const load=url=>new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=url;});
 await load('../atlas.html#biome=RedwoodForest');
 check(frame.contentDocument.querySelector('#detail').open&&frame.contentDocument.querySelector('#detail-title').textContent==='Coastal redwood forest','Habitat deep link opens its biome');
 check(frame.contentDocument.querySelector('#biome-wildlife').getAttribute('href')==='animals.html?biome=RedwoodForest','Biome links back to filtered wildlife');
 await load('../animals.html?biome=RedwoodForest');
 check(frame.contentDocument.querySelectorAll('.card').length===redwood.length&&frame.contentDocument.querySelector('#habitat').value==='RedwoodForest','Biome-to-animal link restores the habitat filter');
 report.dataset.result='passed';report.textContent=JSON.stringify({status:'passed',checks:results},null,2);
}catch(error){report.dataset.result='failed';report.textContent=JSON.stringify({status:'failed',error:String(error),checks:results},null,2);}
},{once:true});
</script></html>
