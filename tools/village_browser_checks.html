<html lang="en"><meta charset="utf-8"><title>Village gallery browser checks</title>
<style>body{font:14px monospace}iframe{display:block;width:1280px;height:900px;border:0}pre{white-space:pre-wrap}</style>
<h1>Village gallery browser checks</h1><pre id="report">Running…</pre><iframe src="../villages.html" title="Village gallery under test"></iframe>
<script>
'use strict';
const frame=document.querySelector('iframe'),report=document.querySelector('#report'),results=[];
const delay=()=>new Promise(resolve=>setTimeout(resolve,50));
function check(ok,message){results.push({passed:!!ok,message});if(!ok)throw Error(message);}
frame.addEventListener('load',async()=>{
try {
 const d=frame.contentDocument,w=frame.contentWindow,q=selector=>d.querySelector(selector);
 const cards=()=>[...d.querySelectorAll('#grid .card')];
 const filters=()=>[...d.querySelectorAll('#filters button')];
 const choose=category=>filters().find(button=>button.dataset.category===category).click();
 const key=value=>d.dispatchEvent(new w.KeyboardEvent('keydown',{key:value,bubbles:true}));
 const close=async()=>{q('#close-detail').click();await delay();};
 const data=w.VILLAGE_GALLERY,shots=data.shots;
 const current=()=>q('#detail-title').textContent;
 const trigger=id=>cards().find(card=>card.dataset.shot===id).querySelector('.card-image');
 function open(id){const button=trigger(id);button.focus();button.click();return button;}
 check(shots.length>=10&&cards().length===shots.length,'Every village photograph appears once');
 check(cards().map(card=>card.dataset.shot).join()===shots.map(shot=>shot.id).join(),'Gallery follows the authored photograph order');
 check(q('#world-seed').textContent===data.seed,'The exact seed is preserved as a string');
 check(q('#world-generation').textContent.includes(String(data.generatorVersion))&&q('#pack-version').textContent.includes(data.packVersion),'The photographed pack and generator versions are visible');
 check(q('#result-count').getAttribute('role')==='status'&&q('#result-count').getAttribute('aria-live')==='polite','Photo counts are announced accessibly');
 check(q('#shot-count').textContent===String(shots.length)&&q('#result-count').textContent===`${shots.length} of ${shots.length} photographs`,'Overview and live count match the dataset');
 check(!q('#village-hero').hidden&&q('#hero-image').alt.length>0,'The featured photograph has an image description');
 const categories=[...new Set(shots.map(shot=>shot.category))];
 check(filters().length===categories.length+1,'Every category has a filter alongside All photographs');
 for(const category of categories){
  choose(category);
  const expected=shots.filter(shot=>shot.category===category);
  check(cards().map(card=>card.dataset.shot).join()===expected.map(shot=>shot.id).join(),`${category} filters its exact photographs`);
  check(filters().filter(button=>button.getAttribute('aria-pressed')==='true').length===1&&filters().find(button=>button.dataset.category===category).getAttribute('aria-pressed')==='true',`${category} has one accessible selected filter`);
  check(q('#result-count').textContent===`${expected.length} of ${shots.length} photographs`,`${category} updates the live count`);
  const button=open(expected[0].id);
  check(q('#detail').open&&current()===expected[0].title,`${category} opens the selected photograph`);
  check(q('#next').disabled===(expected.length===1)&&q('#previous').disabled===(expected.length===1),`${category} disables navigation only for a single photograph`);
  if(expected.length>1){
   q('#previous').click();check(current()===expected.at(-1).title,`${category} previous wraps within its filter`);
   key('ArrowRight');check(current()===expected[0].title,`${category} right arrow wraps within its filter`);
   key('ArrowRight');check(current()===expected[1].title,`${category} right arrow follows its filtered order`);
   key('ArrowLeft');check(current()===expected[0].title,`${category} left arrow follows its filtered order`);
  }
  await close();
  check(!q('#detail').open&&!d.body.classList.contains('modal-open')&&d.activeElement===button,`${category} close restores scrolling and the opening button's focus`);
 }
 choose('');
 for(const shot of shots){
  const button=open(shot.id);
  check(q('#detail').getAttribute('aria-labelledby')==='detail-title'&&q('#detail').getAttribute('aria-describedby')==='detail-description',`${shot.id} dialog has accessible title and description`);
  check(d.activeElement===q('#close-detail'),`${shot.id} puts keyboard focus on the close button`);
  check(current()===shot.title&&q('#detail-description').textContent===shot.description,`${shot.id} preserves its title and field notes`);
  check(q('#detail-image').getAttribute('src')===shot.image&&q('#original-image').getAttribute('href')===shot.image,`${shot.id} displays and links the same original-size image`);
  check(q('#detail-image').alt.includes(shot.title)&&q('#detail-image').width>0,`${shot.id} has descriptive image text and dimensions`);
  check(q('#detail-scene').textContent.startsWith(shot.scene==='generated'?'Generated world':'Inspection scene'),`${shot.id} retains its actual scene label`);
  await close();check(d.activeElement===button,`${shot.id} returns keyboard focus after closing`);
 }
 const hero=shots.find(shot=>shot.id==='lantern-court')||shots[0];
 const otherCategory=categories.find(category=>category!==hero.category);
 if(otherCategory){
  choose(otherCategory);q('#open-hero').focus();q('#open-hero').click();
  const start=shots.findIndex(shot=>shot.id===hero.id);
  for(let index=0;index<=shots.length;index++){
   check(current()===shots[(start+index)%shots.length].title,`Featured photo keeps the full gallery navigation scope at step ${index}`);
   q('#next').click();
  }
  await close();check(d.activeElement===q('#open-hero'),'Closing the featured photo returns focus to its trigger');
 }
 choose('');
 const loaded=await Promise.all(shots.map(shot=>new Promise(resolve=>{
  const image=new Image(),timeout=setTimeout(()=>resolve(false),15000);
  image.onload=()=>{clearTimeout(timeout);resolve(image.naturalWidth===shot.width&&image.naturalHeight===shot.height);};
  image.onerror=()=>{clearTimeout(timeout);resolve(false);};image.src='../'+shot.image;
 })));
 check(loaded.every(Boolean),`All ${shots.length} photographs load at their recorded 960×540 dimensions`);
 for(const width of [320,375,768,1280]){
  frame.style.width=`${width}px`;await delay();
  check(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,`Gallery and filters fit ${width}px`);
  check(cards().every(card=>card.getBoundingClientRect().right<=width+1),`Every photograph card fits ${width}px`);
  for(const shot of shots){
   open(shot.id);await delay();
   const rect=q('#detail').getBoundingClientRect(),image=q('#detail-image').getBoundingClientRect();
   check(q('#detail').scrollWidth<=q('#detail').clientWidth+1&&rect.left>=-1&&rect.right<=width+1,`${shot.id} dialog fits ${width}px`);
   check(image.left>=rect.left-1&&image.right<=rect.right+1,`${shot.id} image stays inside its dialog at ${width}px`);
   await close();
  }
 }
 for(const page of ['index.html','animals.html','islands.html','villages.html']){
  for(const width of [320,375]){
   frame.style.width=`${width}px`;
   await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=`../${page}?qa=header-${width}`;});
   await delay();
   const header=frame.contentDocument.querySelector('.site-header'),nav=header.querySelector('nav');
   check(header.scrollWidth<=header.clientWidth+1&&nav.getBoundingClientRect().right<=width+1,`${page} navigation fits ${width}px`);
   check([...nav.querySelectorAll('a')].some(link=>link.getAttribute('href')==='villages.html'),`${page} links to the village gallery at ${width}px`);
  }
 }
 await new Promise(resolve=>{frame.addEventListener('load',resolve,{once:true});frame.src=`../villages.html?qa=deep-link#shot=${encodeURIComponent(shots.at(-1).id)}`;});
 check(frame.contentDocument.querySelector('#detail').open&&frame.contentDocument.querySelector('#detail-title').textContent===shots.at(-1).title,'An initial photograph deep link opens its matching dialog');
 frame.contentWindow.location.hash=`shot=${encodeURIComponent(shots[0].id)}`;await delay();
 check(frame.contentDocument.querySelector('#detail-title').textContent===shots[0].title,'Changing the photograph hash updates the open dialog');
 report.dataset.result='passed';report.textContent=JSON.stringify({status:'passed',checks:results},null,2);
}catch(error){report.dataset.result='failed';report.textContent=JSON.stringify({status:'failed',error:String(error),checks:results},null,2);}
},{once:true});
</script></html>
